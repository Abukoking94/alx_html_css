<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>


    <style>
    
        .container {
            display: grid;
            height: 500px;
            grid-template-rows: repeat(2, 100px);
            grid-template: repeat(3, 100px)/100px 70fr 30fr;
            border: 2px solid lightblue;
            gap: 2px 8px;
            justify-items: stretch;
            align-items: stretch;
            justify-content: center;
            align-content:center;      
                  
        }

        .box {
          
            background-color: yellow;
            border: 2px black solid;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box">A </div>
        <div class="box">B</div>
        <div class="box">C</div>
        <div class="box">D</div>

    </div>
</body>

</html>
